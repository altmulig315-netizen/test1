<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🔒 Password Strength Checker</h1>
        
        <div class="input-group">
            <input type="password" id="password" placeholder="Skriv inn passord...">
            <span class="toggle-password" id="togglePassword">👁️</span>
        </div>

        <div class="char-count">
            <span id="charCount">0 tegn</span>
        </div>

        <div class="strength-meter">
            <div class="strength-label">
                <span>Passordstyrke:</span>
                <span class="strength-text" id="strengthText">-</span>
            </div>
            <div class="meter-bar">
                <div class="meter-fill" id="meterFill"></div>
            </div>
        </div>

        <div class="requirements">
            <h3>Krav:</h3>
            <div class="requirement" id="req-length">
                <span class="icon"></span>
                <span>Minst 8 tegn</span>
            </div>
            <div class="requirement" id="req-lowercase">
                <span class="icon"></span>
                <span>Små bokstaver (a-z)</span>
            </div>
            <div class="requirement" id="req-uppercase">
                <span class="icon"></span>
                <span>Store bokstaver (A-Z)</span>
            </div>
            <div class="requirement" id="req-number">
                <span class="icon"></span>
                <span>Tall (0-9)</span>
            </div>
            <div class="requirement" id="req-symbol">
                <span class="icon"></span>
                <span>Spesialtegn (!@#$%...)</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
